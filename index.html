<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculadora</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style type="text/tailwindcss">
    .key {
      @apply h-14 sm:h-16 rounded-2xl text-2xl font-semibold transition duration-150 ease-out
             active:scale-95 select-none outline-none cursor-pointer;
    }
  </style>
</head>
<body class="relative min-h-screen overflow-hidden flex items-center justify-center bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 p-4 font-sans">

  <!-- Brilhos de fundo -->
  <div class="pointer-events-none absolute -top-32 -left-32 h-96 w-96 rounded-full bg-indigo-600/30 blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-40 -right-24 h-96 w-96 rounded-full bg-orange-500/20 blur-3xl"></div>

  <div class="container relative w-full max-w-xs sm:max-w-sm rounded-3xl bg-slate-900/70 backdrop-blur-xl ring-1 ring-white/10 shadow-2xl shadow-black/60 p-5">

    <!-- Cabeçalho -->
    <div class="flex items-center gap-2 mb-4 px-1">
      <span class="h-2.5 w-2.5 rounded-full bg-orange-500 shadow-[0_0_10px_rgba(249,115,22,0.8)]"></span>
      <h1 class="text-xs font-semibold uppercase tracking-[0.25em] text-slate-400">Calculadora</h1>
    </div>

    <!-- Visor -->
    <div class="rounded-2xl bg-slate-950/70 ring-1 ring-white/10 px-5 py-4 mb-5 text-right shadow-inner">
      <span id="expression" class="block h-5 text-sm font-mono text-slate-500 truncate"></span>
      <input class="display w-full bg-transparent text-right text-4xl font-mono font-medium text-white placeholder:text-slate-600 outline-none"
             type="text" placeholder="0" disabled>
    </div>

    <!-- Teclado -->
    <div class="grid grid-cols-4 gap-3">
      <button class="key bg-slate-800/90 text-slate-100 hover:bg-slate-700 ring-1 ring-white/5" onclick="input(1)">1</button>
      <button class="key bg-slate-800/90 text-slate-100 hover:bg-slate-700 ring-1 ring-white/5" onclick="input(2)">2</button>
      <button class="key bg-slate-800/90 text-slate-100 hover:bg-slate-700 ring-1 ring-white/5" onclick="input(3)">3</button>
      <button class="key bg-gradient-to-b from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-white shadow-lg shadow-orange-500/30" onclick="operator('+')">+</button>

      <button class="key bg-slate-800/90 text-slate-100 hover:bg-slate-700 ring-1 ring-white/5" onclick="input(4)">4</button>
      <button class="key bg-slate-800/90 text-slate-100 hover:bg-slate-700 ring-1 ring-white/5" onclick="input(5)">5</button>
      <button class="key bg-slate-800/90 text-slate-100 hover:bg-slate-700 ring-1 ring-white/5" onclick="input(6)">6</button>
      <button class="key bg-gradient-to-b from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-white shadow-lg shadow-orange-500/30" onclick="operator('/')">÷</button>

      <button class="key bg-slate-800/90 text-slate-100 hover:bg-slate-700 ring-1 ring-white/5" onclick="input(7)">7</button>
      <button class="key bg-slate-800/90 text-slate-100 hover:bg-slate-700 ring-1 ring-white/5" onclick="input(8)">8</button>
      <button class="key bg-slate-800/90 text-slate-100 hover:bg-slate-700 ring-1 ring-white/5" onclick="input(9)">9</button>
      <button class="key bg-gradient-to-b from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-white shadow-lg shadow-orange-500/30" onclick="operator('*')">×</button>

      <button class="key bg-slate-800/90 text-slate-100 hover:bg-slate-700 ring-1 ring-white/5" onclick="input(0)">0</button>
      <button class="key bg-slate-700/60 text-rose-400 hover:bg-slate-700 ring-1 ring-white/5" onclick="clearDisplay()">C</button>
      <button class="key bg-gradient-to-b from-orange-500 to-rose-500 hover:from-orange-400 hover:to-rose-400 text-white shadow-lg shadow-rose-500/30" onclick="calculate()">=</button>
      <button class="key bg-gradient-to-b from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-white shadow-lg shadow-orange-500/30" onclick="operator('-')">−</button>
    </div>
  </div>

  <script src="./src/script.js"></script>
</body>
</html>
